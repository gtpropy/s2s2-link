<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S2S2 Test Suite</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --dim: #8b949e;
    --accent: #58a6ff;
    --ok: #3fb950;
    --bad: #f85149;
    --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 15px; margin: 0; color: var(--text); }
  header span { color: var(--dim); font-size: 12px; }
  .tabbar {
    display: flex;
    gap: 2px;
    padding: 8px 16px 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    padding: 8px 16px;
    cursor: pointer;
    color: var(--dim);
    font-family: inherit;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tab-btn.active {
    color: var(--text);
    background: var(--bg);
    border-color: var(--border);
    position: relative;
    top: 1px;
  }
  .tab-btn .tab-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--bad);
    display: inline-block;
  }
  .tab-btn .tab-dot.connected { background: var(--ok); }
  .panes {
    display: block;
    background: var(--bg);
    min-height: calc(100vh - 44px);
  }
  .pane {
    background: var(--bg);
    display: none;
    flex-direction: column;
    min-width: 0;
  }
  .pane.active {
    display: flex;
  }
  .pane-head {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    background: var(--panel);
  }
  select, input, button {
    background: #0d1117;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font-family: inherit;
    font-size: 12px;
  }
  button {
    cursor: pointer;
    background: #21262d;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button.danger { border-color: var(--bad); color: var(--bad); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--bad);
    display: inline-block;
  }
  .status-dot.connected { background: var(--ok); }
  .controls {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .controls .group {
    display: flex;
    gap: 4px;
    align-items: center;
    border-right: 1px solid var(--border);
    padding-right: 10px;
    margin-right: 4px;
  }
  .controls .group:last-child { border-right: none; }
  .controls input[type=number] { width: 64px; }
  .controls input[type=text] { width: 140px; }
  .console {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .console .line { border-bottom: 1px dashed #1c2128; padding: 1px 0; }
  .console .kind-RAW { color: var(--text); }
  .console .kind-SENT { color: var(--accent); }
  .console .kind-CYCLE_PHASE { color: var(--warn); font-weight: bold; }
  .console .kind-CONNECTED, .console .kind-SDR_CONNECTED { color: var(--ok); }
  .console .kind-DISCONNECTED, .console .kind-SDR_DISCONNECTED, .console .kind-SDR_ERROR { color: var(--bad); }
  .console .kind-BATTERY_STEP { color: #d2a8ff; }
  .console .kind-BATTERY_STARTED, .console .kind-BATTERY_STOPPED { color: var(--warn); font-weight: bold; }
  .console .kind-SDR_FRAME { color: #79c0ff; }
  .console .kind-SDR_CW_TEXT { color: #ffa657; }
  .console .ts { color: var(--dim); margin-right: 6px; }
  .sdr-stats {
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--dim);
  }
  .sdr-stats b { color: var(--text); }
  .hidden { display: none !important; }
  .battery-badge {
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid var(--warn);
    color: var(--warn);
    font-size: 11px;
  }
  .activity-stats {
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--dim);
  }
  .activity-stats b { color: var(--text); }
  .console-toolbar {
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    font-size: 11px;
  }
  .console-toolbar input[type=text] { width: 140px; }
  .console-toolbar label { display: flex; align-items: center; gap: 3px; cursor: pointer; user-select: none; }
  .console-toolbar button.active { border-color: var(--accent); color: var(--accent); }
  .memory-panel {
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .memory-panel-head {
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .memory-panel-body {
    padding: 4px 16px 14px;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .mem-bar-wrap { min-width: 220px; }
  .mem-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-bottom: 3px; }
  .mem-bar-track { height: 10px; background: #0d1117; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .mem-bar-fill { height: 100%; background: var(--accent); }
  .mem-bar-fill.ram { background: var(--warn); }
  .mem-symbols { font-size: 11px; }
  .mem-symbols table { border-collapse: collapse; }
  .mem-symbols td { padding: 1px 8px 1px 0; color: var(--dim); }
  .mem-symbols td.sz { color: var(--text); text-align: right; }
  .mem-note { font-size: 10px; color: var(--dim); max-width: 360px; }
  .fault-cat { margin-bottom: 10px; min-width: 260px; }
  .fault-cat-head { font-size: 12px; margin-bottom: 3px; }
  .fault-cat-head b.ok { color: var(--ok); }
  .fault-cat-head b.bad { color: var(--warn); }
  .fault-row { font-size: 10px; padding: 1px 0; display: flex; gap: 6px; }
  .fault-row .mark { width: 34px; flex-shrink: 0; }
  .fault-row.pass .mark { color: var(--ok); }
  .fault-row.fail .mark { color: var(--bad); }
  .fault-row .detail { color: var(--dim); }
  .fault-score {
    font-size: 22px;
    font-weight: bold;
    padding: 4px 0 10px;
  }
  .mode-presets {
    padding: 6px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    display: flex;
    align-items: center;
    gap: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>S2S2 Test Suite</h1>
  <span>Unified bench link tester -- satellite / ground station / SDR, no PyQt5</span>
</header>

<div class="memory-panel" id="mem-panel">
  <div class="memory-panel-head" id="mem-panel-toggle">
    <span id="mem-caret">&#9656;</span>
    <b>STM32 Memory Profile</b>
    <span id="mem-summary" style="color:var(--dim)">-- click to load --</span>
    <span id="mem-live" style="color:var(--warn)"></span>
    <button id="mem-refresh" style="margin-left:auto">refresh</button>
  </div>
  <div class="memory-panel-body hidden" id="mem-panel-body"></div>
</div>

<div class="memory-panel" id="fault-panel">
  <div class="memory-panel-head" id="fault-panel-toggle">
    <span id="fault-caret">&#9656;</span>
    <b>Fault Injection Suite (100 tests)</b>
    <span id="fault-summary" style="color:var(--dim)">-- click to load --</span>
    <button id="fault-run" style="margin-left:auto" class="primary">RUN 100 TESTS</button>
  </div>
  <div class="memory-panel-body hidden" id="fault-panel-body"></div>
</div>

<div class="mode-presets">
  <span style="color:var(--dim);margin-right:6px">mode:</span>
  <button id="preset-sdr">RX/TX-SDR (sat + SDR RX)</button>
  <button id="preset-gs-sat">RX/TX-RX/TX (GS + SAT)</button>
</div>

<div class="tabbar" id="tabbar">
  <button class="tab-btn active" data-tab="a"><span class="tab-dot" id="tabdot-a"></span><span id="tablabel-a">Pane A: Disconnected</span></button>
  <button class="tab-btn" data-tab="b"><span class="tab-dot" id="tabdot-b"></span><span id="tablabel-b">Pane B: Disconnected</span></button>
</div>
<div class="panes" id="panes"></div>

<script>
const ROLES = ["none", "satellite", "ground", "sdr"];
const ROLE_LABEL = { none: "Disconnected", satellite: "Satellite", ground: "Ground Station", sdr: "SDR" };

class PaneUI {
  constructor(paneId, root) {
    this.paneId = paneId;
    this.root = root;
    this.ws = null;
    this.gsCommands = [];
    this.events = [];          // full log buffer (all kinds), for search/filter re-render
    this.paused = false;
    this.hideRaw = false;
    this.searchText = "";
    this.render();
    this.connectWs();
    this.refreshPorts();
  }

  el(html) {
    // Returns a DocumentFragment holding EVERY top-level node in `html`,
    // not just the first -- appendChild(fragment) moves them all into
    // the target as direct siblings (so .controls' flex-wrap still
    // applies to each <span class="group"> individually). The old
    // firstChild-only version silently dropped every control group
    // after the first one in a multi-span template (satellite controls
    // has 10) -- real bug, not just a display issue: most of the
    // satellite control panel never rendered at all.
    const template = document.createElement("template");
    template.innerHTML = html.trim();
    return template.content;
  }

  render() {
    this.root.innerHTML = `
      <div class="pane-head">
        <span class="status-dot" id="dot-${this.paneId}"></span>
        <select id="role-${this.paneId}">
          ${ROLES.map(r => `<option value="${r}">${ROLE_LABEL[r]}</option>`).join("")}
        </select>
        <span id="conn-area-${this.paneId}"></span>
      </div>
      <div class="controls" id="controls-${this.paneId}"></div>
      <div class="sdr-stats hidden" id="stats-${this.paneId}"></div>
      <div class="activity-stats hidden" id="activity-${this.paneId}"></div>
      <div class="console-toolbar">
        <input type="text" id="search-${this.paneId}" placeholder="filter console...">
        <button id="hideraw-${this.paneId}">hide RAW</button>
        <label><input type="checkbox" id="pause-${this.paneId}"> pause</label>
        <button id="clear-${this.paneId}">clear</button>
        <button id="save-${this.paneId}">save log</button>
        <span id="count-${this.paneId}" style="color:var(--dim)"></span>
      </div>
      <div class="console" id="console-${this.paneId}"></div>
    `;
    this.dot = this.root.querySelector(`#dot-${this.paneId}`);
    this.tabDot = document.getElementById(`tabdot-${this.paneId}`);
    this.tabLabel = document.getElementById(`tablabel-${this.paneId}`);
    this.roleSelect = this.root.querySelector(`#role-${this.paneId}`);
    this.connArea = this.root.querySelector(`#conn-area-${this.paneId}`);
    this.controls = this.root.querySelector(`#controls-${this.paneId}`);
    this.stats = this.root.querySelector(`#stats-${this.paneId}`);
    this.activityBar = this.root.querySelector(`#activity-${this.paneId}`);
    this.console = this.root.querySelector(`#console-${this.paneId}`);
    this.countLabel = this.root.querySelector(`#count-${this.paneId}`);

    this.roleSelect.addEventListener("change", () => this.onRoleChange());
    this.root.querySelector(`#search-${this.paneId}`).addEventListener("input", (e) => {
      this.searchText = e.target.value.toLowerCase();
      this.renderConsole();
    });
    const hideRawBtn = this.root.querySelector(`#hideraw-${this.paneId}`);
    hideRawBtn.addEventListener("click", () => {
      this.hideRaw = !this.hideRaw;
      hideRawBtn.classList.toggle("active", this.hideRaw);
      this.renderConsole();
    });
    this.root.querySelector(`#pause-${this.paneId}`).addEventListener("change", (e) => {
      this.paused = e.target.checked;
      if (!this.paused) this.renderConsole();
    });
    this.root.querySelector(`#clear-${this.paneId}`).addEventListener("click", () => {
      this.events = [];
      this.renderConsole();
    });
    this.root.querySelector(`#save-${this.paneId}`).addEventListener("click", () => this.saveLog());

    this.renderRole("none");
  }

  saveLog() {
    const text = this.events.map(ev => this.formatEvent(ev)).join("\n");
    const blob = new Blob([text], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `s2s2-pane-${this.paneId}-${Date.now()}.log`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async api(path, method = "GET", body) {
    const opts = { method, headers: {} };
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    const res = await fetch(`/api/pane/${this.paneId}${path}`, opts);
    return res.json();
  }

  async refreshPorts() {
    const res = await fetch("/api/ports");
    this.ports = await res.json();
  }

  async onRoleChange() {
    this.stopMemstatPoll();
    const role = this.roleSelect.value;
    await this.api("/role", "POST", { role });
    this.renderRole(role);
  }

  renderRole(role) {
    if (this.tabLabel) this.tabLabel.textContent = `Pane ${this.paneId.toUpperCase()}: ${ROLE_LABEL[role]}`;
    this.connArea.innerHTML = "";
    this.controls.innerHTML = "";
    this.stats.classList.add("hidden");
    if (this.activityBar) this.activityBar.classList.add("hidden");

    if (role === "satellite" || role === "ground") {
      this.renderSerialConn(role);
      this.renderSerialControls(role);
    } else if (role === "sdr") {
      this.renderSdrConn();
      this.stats.classList.remove("hidden");
      this.stats.innerHTML = `<span>power: <b id="sp-${this.paneId}">--</b> dBFS</span>
        <span>mode: <b id="sm-${this.paneId}">--</b></span>
        <span>locked: <b id="sl-${this.paneId}">--</b></span>
        <span>decoded: <b id="sd-${this.paneId}">0</b></span>
        <span>rejected: <b id="sr-${this.paneId}">0</b></span>
        <span>CW copy: <b id="scw-${this.paneId}">--</b></span>
        <span>CW WPM: <b id="swpm-${this.paneId}">--</b></span>
        <span>CW chars: <b id="schars-${this.paneId}">0</b></span>
        <span>CW env: <b id="cwenv-${this.paneId}">--</b> dBFS</span>`;
    }
  }

  renderSerialConn(role) {
    const baudDefault = role === "satellite" || role === "ground" ? 115200 : 115200;
    this.connArea.appendChild(this.el(`
      <span class="group" style="display:inline-flex;border:none">
        <select id="port-${this.paneId}"></select>
        <input type="number" id="baud-${this.paneId}" value="${baudDefault}" style="width:80px">
        <button id="refresh-${this.paneId}">refresh</button>
        <button id="connect-${this.paneId}" class="primary">connect</button>
        <button id="disconnect-${this.paneId}" class="danger">disconnect</button>
      </span>
    `));
    const portSel = this.root.querySelector(`#port-${this.paneId}`);
    const fillPorts = () => {
      portSel.innerHTML = (this.ports || []).map(
        p => `<option value="${p.device}">${p.device} -- ${p.description}</option>`
      ).join("") || `<option value="">(no ports found)</option>`;
    };
    fillPorts();
    this.root.querySelector(`#refresh-${this.paneId}`).onclick = async () => {
      await this.refreshPorts();
      fillPorts();
    };
    this.root.querySelector(`#connect-${this.paneId}`).onclick = async () => {
      const port = portSel.value;
      const baud = parseInt(this.root.querySelector(`#baud-${this.paneId}`).value, 10);
      const r = await this.api("/connect", "POST", { port, baud });
      if (!r.ok) alert(`connect failed: ${r.error}`);
      else this.fetchInitialActivity();
    };
    this.root.querySelector(`#disconnect-${this.paneId}`).onclick = () => {
      this.stopMemstatPoll();
      this.api("/disconnect", "POST");
    };
  }

  renderSdrConn() {
    this.connArea.appendChild(this.el(`
      <span class="group" style="display:inline-flex;border:none;flex-wrap:wrap">
        freq(Hz) <input type="number" id="freq-${this.paneId}" value="435000000" style="width:110px">
        rate <input type="number" id="rate-${this.paneId}" value="240000" style="width:80px">
        gain <input type="text" id="gain-${this.paneId}" value="auto" style="width:50px">
        baud <input type="number" id="sbaud-${this.paneId}" value="4800" style="width:60px">
        CW threshold(dBFS) <input type="number" id="cwthresh-${this.paneId}" value="-20" style="width:60px"
          title="CW mark/space gate. Must sit between your noise floor and your keyed-carrier level -- watch the live 'CW env' reading and lower this (more negative) if it never crosses above during a real CW TX">
        CW bw(Hz) <input type="number" id="cwbw-${this.paneId}" value="200" style="width:60px">
        <button id="connect-${this.paneId}" class="primary">connect SDR</button>
        <button id="disconnect-${this.paneId}" class="danger">disconnect</button>
      </span>
    `));
    this.root.querySelector(`#connect-${this.paneId}`).onclick = async () => {
      const body = {
        freq_hz: parseFloat(this.root.querySelector(`#freq-${this.paneId}`).value),
        sample_rate: parseFloat(this.root.querySelector(`#rate-${this.paneId}`).value),
        gain: this.root.querySelector(`#gain-${this.paneId}`).value,
        baud: parseFloat(this.root.querySelector(`#sbaud-${this.paneId}`).value),
        cw_threshold_dbfs: parseFloat(this.root.querySelector(`#cwthresh-${this.paneId}`).value),
        cw_bandwidth_hz: parseFloat(this.root.querySelector(`#cwbw-${this.paneId}`).value),
      };
      const r = await this.api("/connect_sdr", "POST", body);
      if (!r.ok) alert(`SDR connect failed: ${r.error}`);
    };
    this.root.querySelector(`#disconnect-${this.paneId}`).onclick = () => {
      this.stopMemstatPoll();
      this.api("/disconnect", "POST");
    };
  }

  renderSerialControls(role) {
    if (role === "satellite") {
      this.controls.appendChild(this.el(`
        <span class="group">
          TX power(dBm) <input type="number" id="pwr-${this.paneId}" value="10" min="-9" max="22">
          <button id="setpwr-${this.paneId}">set</button>
        </span>
        <span class="group">
          hex <input type="text" id="msg-${this.paneId}" placeholder="48656C6C6F">
          <button id="sendmsg-${this.paneId}">send message</button>
        </span>
        <span class="group">
          <button id="cw-${this.paneId}">CW</button>
          <button id="b1-${this.paneId}">Beacon1</button>
          <button id="b2-${this.paneId}">Beacon2</button>
        </span>
        <span class="group">
          CW text <input type="text" id="txcw-${this.paneId}" placeholder="HELLO WORLD" style="width:140px">
          <button id="sendtxcw-${this.paneId}">send via CW</button>
        </span>
        <span class="group">
          Test Digipeat (168-byte FX.25 hex)
          <input type="text" id="digihex-${this.paneId}" placeholder="336 hex chars" style="width:140px">
          <button id="senddigi-${this.paneId}">TESTDIGI</button>
        </span>
        <span class="group">
          <button id="beaconon-${this.paneId}">BEACON ON</button>
          <button id="beaconoff-${this.paneId}">BEACON OFF</button>
        </span>
        <span class="group">
          <button id="satmodeon-${this.paneId}">SATMODE ON</button>
          <button id="satmodeoff-${this.paneId}">SATMODE OFF</button>
        </span>
        <span class="group">
          <button id="battstart-${this.paneId}" class="primary">Full Test Battery: start</button>
          <button id="battstop-${this.paneId}" class="danger">stop</button>
          <span id="battbadge-${this.paneId}"></span>
        </span>
        <span class="group">
          <input type="text" id="raw-${this.paneId}" placeholder="raw command">
          <button id="sendraw-${this.paneId}">send</button>
        </span>
      `));
      this.root.querySelector(`#setpwr-${this.paneId}`).onclick = () =>
        this.api("/tx_power", "POST", { dbm: parseInt(this.root.querySelector(`#pwr-${this.paneId}`).value, 10) });
      this.root.querySelector(`#sendmsg-${this.paneId}`).onclick = () =>
        this.api("/send_message", "POST", { hex: this.root.querySelector(`#msg-${this.paneId}`).value });
      this.root.querySelector(`#cw-${this.paneId}`).onclick = () => this.api("/cw", "POST");
      this.root.querySelector(`#b1-${this.paneId}`).onclick = () => this.api("/beacon1", "POST");
      this.root.querySelector(`#b2-${this.paneId}`).onclick = () => this.api("/beacon2", "POST");
      this.root.querySelector(`#sendtxcw-${this.paneId}`).onclick = async () => {
        const el = this.root.querySelector(`#txcw-${this.paneId}`);
        if (!el.value.trim()) return;
        const r = await this.api("/txcw", "POST", { text: el.value.trim() });
        if (!r.ok) alert(`TXCW failed: ${r.error}`);
      };
      this.root.querySelector(`#senddigi-${this.paneId}`).onclick = async () => {
        const el = this.root.querySelector(`#digihex-${this.paneId}`);
        const r = await this.api("/testdigi", "POST", { hex: el.value.trim() });
        if (!r.ok) alert(`TESTDIGI failed: ${r.error}`);
      };
      this.root.querySelector(`#beaconon-${this.paneId}`).onclick = () => this.api("/beacon_toggle", "POST", { on: true });
      this.root.querySelector(`#beaconoff-${this.paneId}`).onclick = () => this.api("/beacon_toggle", "POST", { on: false });
      this.root.querySelector(`#satmodeon-${this.paneId}`).onclick = () => this.api("/satmode", "POST", { on: true });
      this.root.querySelector(`#satmodeoff-${this.paneId}`).onclick = () => this.api("/satmode", "POST", { on: false });
      this.root.querySelector(`#battstart-${this.paneId}`).onclick = () => this.api("/battery/start", "POST");
      this.root.querySelector(`#battstop-${this.paneId}`).onclick = () => this.api("/battery/stop", "POST");
      this.root.querySelector(`#sendraw-${this.paneId}`).onclick = () => {
        const el = this.root.querySelector(`#raw-${this.paneId}`);
        if (el.value.trim()) this.api("/raw", "POST", { text: el.value.trim() });
      };
    } else if (role === "ground") {
      fetch("/api/gs_commands").then(r => r.json()).then(cmds => {
        this.controls.appendChild(this.el(`
          <span class="group">
            <select id="gscmd-${this.paneId}">
              ${cmds.map(c => `<option value="${c}">${c}</option>`).join("")}
            </select>
            <button id="gssend-${this.paneId}">send</button>
          </span>
          <span class="group">
            <input type="text" id="raw-${this.paneId}" placeholder="raw command">
            <button id="sendraw-${this.paneId}">send</button>
          </span>
        `));
        this.root.querySelector(`#gssend-${this.paneId}`).onclick = () =>
          this.api("/raw", "POST", { text: this.root.querySelector(`#gscmd-${this.paneId}`).value });
        this.root.querySelector(`#sendraw-${this.paneId}`).onclick = () => {
          const el = this.root.querySelector(`#raw-${this.paneId}`);
          if (el.value.trim()) this.api("/raw", "POST", { text: el.value.trim() });
        };
      });
    }
  }

  connectWs() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    this.ws = new WebSocket(`${proto}//${location.host}/ws/${this.paneId}`);
    this.ws.onmessage = (ev) => this.onEvent(JSON.parse(ev.data));
    this.ws.onclose = () => setTimeout(() => this.connectWs(), 1500);
  }

  formatEvent(ev) {
    const time = new Date((ev.ts || Date.now() / 1000) * 1000).toLocaleTimeString();
    const text = ev.raw_line !== undefined ? ev.raw_line
      : ev.kind === "SENT" ? `>> ${ev.text}`
      : JSON.stringify(ev);
    return `${time}  ${text}`;
  }

  escape(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  matchesFilter(ev) {
    if (this.hideRaw && ev.kind === "RAW") return false;
    if (this.searchText) {
      const hay = this.formatEvent(ev).toLowerCase();
      if (!hay.includes(this.searchText)) return false;
    }
    return true;
  }

  renderConsole() {
    this.console.innerHTML = "";
    const visible = this.events.filter(ev => this.matchesFilter(ev));
    const toShow = visible.slice(-500);
    for (const ev of toShow) {
      const time = new Date((ev.ts || Date.now() / 1000) * 1000).toLocaleTimeString();
      const text = ev.raw_line !== undefined ? ev.raw_line
        : ev.kind === "SENT" ? `>> ${ev.text}`
        : JSON.stringify(ev);
      const line = document.createElement("div");
      line.className = `line kind-${ev.kind}`;
      line.innerHTML = `<span class="ts">${time}</span>${this.escape(text)}`;
      this.console.appendChild(line);
    }
    this.console.scrollTop = this.console.scrollHeight;
    if (this.countLabel) this.countLabel.textContent = `${visible.length}/${this.events.length} lines`;
  }

  logLine(ev) {
    this.events.push(ev);
    while (this.events.length > 5000) this.events.shift();
    if (this.paused) return;
    if (!this.matchesFilter(ev)) {
      if (this.countLabel) this.countLabel.textContent =
        `${this.events.filter(e => this.matchesFilter(e)).length}/${this.events.length} lines`;
      return;
    }
    const time = new Date((ev.ts || Date.now() / 1000) * 1000).toLocaleTimeString();
    const text = ev.raw_line !== undefined ? ev.raw_line
      : ev.kind === "SENT" ? `>> ${ev.text}`
      : JSON.stringify(ev);
    const line = document.createElement("div");
    line.className = `line kind-${ev.kind}`;
    line.innerHTML = `<span class="ts">${time}</span>${this.escape(text)}`;
    this.console.appendChild(line);
    while (this.console.childNodes.length > 500) this.console.removeChild(this.console.firstChild);
    this.console.scrollTop = this.console.scrollHeight;
    if (this.countLabel) this.countLabel.textContent =
      `${this.events.filter(e => this.matchesFilter(e)).length}/${this.events.length} lines`;
  }

  onEvent(ev) {
    if (ev.kind === "CONNECTED" || ev.kind === "SDR_CONNECTED") {
      this.dot.classList.add("connected");
      if (this.tabDot) this.tabDot.classList.add("connected");
    }
    if (ev.kind === "DISCONNECTED" || ev.kind === "SDR_DISCONNECTED") {
      this.dot.classList.remove("connected");
      if (this.tabDot) this.tabDot.classList.remove("connected");
    }

    if (ev.kind === "SDR_STATUS") {
      const g = (id) => this.root.querySelector(`#${id}-${this.paneId}`);
      if (g("sp")) g("sp").textContent = ev.signal_power_dbfs.toFixed(1);
      if (g("sm")) g("sm").textContent = ev.mode;
      if (g("sl")) g("sl").textContent = ev.locked_combo ? JSON.stringify(ev.locked_combo) : "no";
      if (g("sd")) g("sd").textContent = ev.decoded_total;
      if (g("sr")) g("sr").textContent = ev.rejected_total;
      return; // stats bar only, don't spam the console with every chunk
    }
    if (ev.kind === "SDR_CW_TEXT") {
      const g = (id) => this.root.querySelector(`#${id}-${this.paneId}`);
      if (g("scw")) g("scw").textContent = ev.text.slice(-40) || "(no CW copy yet)";
      if (g("swpm")) g("swpm").textContent = ev.wpm_estimate != null ? ev.wpm_estimate : "--";
      if (g("schars")) g("schars").textContent = ev.char_count;
      if (g("cwenv")) g("cwenv").textContent = ev.env_dbfs.toFixed(1);
      return; // stats bar only -- this was the bug: falling through here spammed
              // the console with raw JSON every ~0.5s CW chunk
    }
    if (ev.kind === "ACTIVITY") {
      this.renderActivity(ev);
      return; // pure stat -- the activity bar already shows this, no separate log line needed
    }
    if (ev.kind === "CYCLE_PHASE") {
      // Same redundancy MEMSTAT had: this is pure state (the activity
      // bar's "phase:" field already shows it) -- the backend fires a
      // full ACTIVITY event right alongside every CYCLE_PHASE match
      // (activity_changed=True), which updates the whole bar including
      // this new phase a moment later, so there's nothing to render
      // here, just nothing to log either. Not a one-off action worth
      // its own log line the way a beacon TX or a digipeat relay is --
      // those keep logging normally.
      return;
    }
    if (ev.kind === "MEMSTAT") {
      // Real bug: this had no handler, so it fell through to the plain
      // console log as a raw-looking text line -- redundant with (and
      // more confusing than) the live numbers below, since the paired
      // ACTIVITY event (activity_changed=True on the backend for a
      // MEMSTAT match) already re-renders the per-pane activity bar's
      // "LIVE stack" figure with the same data. Feed the global STM32
      // Memory Profile panel too, so the one real-time number this repo
      // has actually shows up where "the memory profile" lives, not
      // just buried in a per-pane stats strip.
      updateLiveMemoryFromMemstat(ev);
      return;
    }
    if (ev.kind === "BATTERY_STARTED" || ev.kind === "BATTERY_STEP") {
      const badge = this.root.querySelector(`#battbadge-${this.paneId}`);
      if (badge) badge.innerHTML = `<span class="battery-badge">RUNNING cycle ${ev.cycle || 0}</span>`;
    }
    if (ev.kind === "BATTERY_STOPPED") {
      const badge = this.root.querySelector(`#battbadge-${this.paneId}`);
      if (badge) badge.innerHTML = "";
    }
    this.logLine(ev);
  }

  renderActivity(ev) {
    if (!this.activityBar) return;
    this.activityBar.classList.remove("hidden");
    const uptime = ev.uptime_s != null ? `${ev.uptime_s.toFixed(0)}s` : "--";
    const stackLine = ev.stack_used_bytes != null
      ? `<span>LIVE stack: <b>${ev.stack_used_bytes}/${ev.stack_total_bytes} B (${ev.stack_pct}%)</b> real-time high-water-mark</span>`
      : `<span style="color:var(--dim)">LIVE stack: -- (send MEMSTAT once, or wait for auto-poll)</span>`;
    this.activityBar.innerHTML = `
      <span>uptime: <b>${uptime}</b></span>
      <span>phase: <b>${ev.cycle_phase || "--"}</b></span>
      <span>lines: <b>${ev.lines_total}</b></span>
      <span>CW TX: <b>${ev.cw_tx_count}</b></span>
      <span>Beacon1 TX: <b>${ev.beacon1_tx_count}</b></span>
      <span>Beacon2 TX: <b>${ev.beacon2_tx_count}</b></span>
      <span>digi relayed: <b>${ev.digi_relayed}</b></span>
      <span>digi dup: <b>${ev.digi_duplicate}</b></span>
      <span>digi failed: <b>${ev.digi_failed}</b></span>
      ${stackLine}
    `;
  }

  async fetchInitialActivity() {
    if (!this.activityBar) return;
    const res = await fetch(`/api/pane/${this.paneId}/activity`);
    const body = await res.json();
    if (body.ok) {
      this.activityBar.classList.remove("hidden");
      this.renderActivity(body);
    }
    // Real, live (not static) memory monitor -- polls the actual running
    // chip's stack high-water-mark every 5s while this pane is connected
    // to a satellite/ground UART. Stops automatically on disconnect.
    this.stopMemstatPoll();
    this._memstatTimer = setInterval(() => this.api("/memstat", "POST"), 5000);
    this.api("/memstat", "POST"); // first reading immediately, don't wait 5s
  }

  stopMemstatPoll() {
    if (this._memstatTimer) {
      clearInterval(this._memstatTimer);
      this._memstatTimer = null;
    }
  }
}

const panesRoot = document.getElementById("panes");
const paneA = document.createElement("div"); paneA.className = "pane active";
const paneB = document.createElement("div"); paneB.className = "pane";
panesRoot.appendChild(paneA);
panesRoot.appendChild(paneB);

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".pane").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    (btn.dataset.tab === "a" ? paneA : paneB).classList.add("active");
  });
});

new PaneUI("a", paneA);
new PaneUI("b", paneB);

// ---------------------------------------------------------------------
// Global STM32 memory profile panel -- real arm-none-eabi-size/-nm
// numbers off the built .elf (CPU2/ipcc_m0plus.elf), refreshed on
// demand -- flash/RAM section sizes, link-time only, can't change while
// running. The LIVE figure next to it (mem-live span) is the actual
// runtime number: the satellite's real stack high-water-mark, from the
// MEMSTAT UART command (core/Src/mem_stats.c's stack-painting), pushed
// here the instant any connected pane sees a MEMSTAT response -- see
// updateLiveMemoryFromMemstat() below and PaneUI.onEvent's MEMSTAT case.
// ---------------------------------------------------------------------
let memPanelOpen = false;

function updateLiveMemoryFromMemstat(ev) {
  const live = document.getElementById("mem-live");
  if (!live) return;
  const when = new Date((ev.ts || Date.now() / 1000) * 1000).toLocaleTimeString();
  live.textContent = `LIVE stack (pane ${ev.pane}): ${ev.stack_used_bytes}/${ev.stack_total_bytes} B `
    + `(${(100 * ev.stack_used_bytes / ev.stack_total_bytes).toFixed(1)}%) @ ${when}`;
}

async function loadMemoryProfile() {
  const summary = document.getElementById("mem-summary");
  const body = document.getElementById("mem-panel-body");
  summary.textContent = "loading...";
  try {
    const res = await fetch("/api/memory_profile");
    const p = await res.json();
    if (!p.ok) {
      summary.textContent = `unavailable -- ${p.error}`;
      body.innerHTML = "";
      return;
    }
    summary.textContent = `flash ${p.flash_pct}% (${p.flash_used}/${p.flash_total} B) -- `
      + `RAM ${p.ram_pct}% (${p.ram_used}/${p.ram_total} B)`;
    const builtAt = new Date(p.elf_mtime * 1000).toLocaleString();
    body.innerHTML = `
      <div class="mem-bar-wrap">
        <div class="mem-bar-label"><span>Flash (.text+.data)</span><span>${p.flash_pct}%</span></div>
        <div class="mem-bar-track"><div class="mem-bar-fill" style="width:${p.flash_pct}%"></div></div>
        <div class="mem-bar-label" style="margin-top:8px"><span>RAM (.data+.bss)</span><span>${p.ram_pct}%</span></div>
        <div class="mem-bar-track"><div class="mem-bar-fill ram" style="width:${p.ram_pct}%"></div></div>
        <div class="mem-note" style="margin-top:8px">
          text=${p.text} data=${p.data} bss=${p.bss} bytes. Built ${builtAt}.<br>
          Static link-time sizes only -- no runtime stack high-water-mark
          (would need a firmware MEMSTAT command to paint+check the stack,
          not yet added). Source: ${p.elf_path}
        </div>
      </div>
      <div class="mem-symbols">
        <b>Largest symbols</b>
        <table>
          ${p.top_symbols.map(s => `<tr><td>${s.name}</td><td>${s.type}</td><td class="sz">${s.size} B</td></tr>`).join("")}
        </table>
      </div>
    `;
  } catch (e) {
    summary.textContent = `error: ${e}`;
  }
}

document.getElementById("mem-panel-toggle").addEventListener("click", () => {
  memPanelOpen = !memPanelOpen;
  document.getElementById("mem-panel-body").classList.toggle("hidden", !memPanelOpen);
  document.getElementById("mem-caret").innerHTML = memPanelOpen ? "&#9662;" : "&#9656;";
  if (memPanelOpen) loadMemoryProfile();
});
document.getElementById("mem-refresh").addEventListener("click", (e) => {
  e.stopPropagation();
  if (!memPanelOpen) {
    memPanelOpen = true;
    document.getElementById("mem-panel-body").classList.remove("hidden");
    document.getElementById("mem-caret").innerHTML = "&#9662;";
  }
  loadMemoryProfile();
});

// ---------------------------------------------------------------------
// Fault injection suite -- 100 real tests against the actual compiled
// firmware decode math (see fault_injection_suite.py), streamed live
// over /ws/fault_suite as each test completes.
// ---------------------------------------------------------------------
let faultPanelOpen = false;
let faultResults = [];
let faultWs = null;

function connectFaultWs() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  faultWs = new WebSocket(`${proto}//${location.host}/ws/fault_suite`);
  faultWs.onmessage = (ev) => onFaultEvent(JSON.parse(ev.data));
  faultWs.onclose = () => setTimeout(connectFaultWs, 1500);
}
connectFaultWs();

function renderFaultResults() {
  const body = document.getElementById("fault-panel-body");
  const byCat = {};
  for (const r of faultResults) {
    (byCat[r.category] = byCat[r.category] || []).push(r);
  }
  const passed = faultResults.filter(r => r.passed).length;
  let html = `<div style="width:100%"><div class="fault-score">${passed}/${faultResults.length || 100}</div>`;
  for (const [cat, rows] of Object.entries(byCat)) {
    const catPassed = rows.filter(r => r.passed).length;
    const cls = catPassed === rows.length ? "ok" : "bad";
    html += `<div class="fault-cat">
      <div class="fault-cat-head">${cat} <b class="${cls}">${catPassed}/${rows.length}</b></div>`;
    for (const r of rows) {
      if (r.passed) continue; // only show failures inline -- keep the panel scannable
      html += `<div class="fault-row fail"><span class="mark">FAIL</span><span class="detail">#${r.id} ${r.name} -- ${r.detail}</span></div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  body.innerHTML = html;
}

function onFaultEvent(ev) {
  const summary = document.getElementById("fault-summary");
  if (ev.kind === "FAULT_SUITE_STARTED") {
    faultResults = [];
    summary.textContent = "running...";
  } else if (ev.kind === "FAULT_SUITE_PROGRESS") {
    faultResults.push({ id: ev.id, category: ev.category, name: ev.name, passed: ev.passed, detail: ev.detail });
    summary.textContent = `${ev.index}/${ev.total} run, ${faultResults.filter(r=>r.passed).length} passed so far`;
    if (faultPanelOpen) renderFaultResults();
  } else if (ev.kind === "FAULT_SUITE_DONE") {
    summary.textContent = `DONE: ${ev.passed}/${ev.total} -- click to expand`;
    if (faultPanelOpen) renderFaultResults();
  } else if (ev.kind === "FAULT_SUITE_ERROR") {
    summary.textContent = `ERROR: ${ev.error.split("\n")[0]}`;
  }
}

document.getElementById("fault-panel-toggle").addEventListener("click", () => {
  faultPanelOpen = !faultPanelOpen;
  document.getElementById("fault-panel-body").classList.toggle("hidden", !faultPanelOpen);
  document.getElementById("fault-caret").innerHTML = faultPanelOpen ? "&#9662;" : "&#9656;";
  if (faultPanelOpen) renderFaultResults();
});
document.getElementById("fault-run").addEventListener("click", async (e) => {
  e.stopPropagation();
  if (!faultPanelOpen) {
    faultPanelOpen = true;
    document.getElementById("fault-panel-body").classList.remove("hidden");
    document.getElementById("fault-caret").innerHTML = "&#9662;";
  }
  const r = await fetch("/api/fault_suite/start", { method: "POST" });
  const body = await r.json();
  if (!body.ok) alert(`could not start: ${body.error}`);
});

// ---------------------------------------------------------------------
// Mode presets -- "RX/TX-SDR" (one real board TX'ing, SDR RX-only,
// for over-the-air link testing) vs "RX/TX-RX/TX" (two real boards,
// ground station + satellite, each with a full bidirectional debug
// backdoor -- for link-layer/protocol testing without needing RF at
// all). Just pre-sets both panes' roles to the matching combination;
// the underlying panes stay fully independent/reassignable afterward.
// ---------------------------------------------------------------------
async function applyPreset(roleA, roleB) {
  await fetch("/api/pane/a/role", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({role: roleA}) });
  await fetch("/api/pane/b/role", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({role: roleB}) });
  location.reload();
}
document.getElementById("preset-sdr").addEventListener("click", () => {
  if (confirm("Switch to RX/TX-SDR mode: Pane A = Satellite, Pane B = SDR (RX-only)? This resets both panes' current roles.")) {
    applyPreset("satellite", "sdr");
  }
});
document.getElementById("preset-gs-sat").addEventListener("click", () => {
  if (confirm("Switch to RX/TX-RX/TX mode: Pane A = Satellite, Pane B = Ground Station (both full bidirectional debug backdoors)? This resets both panes' current roles.")) {
    applyPreset("satellite", "ground");
  }
});
