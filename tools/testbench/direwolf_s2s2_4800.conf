# Direwolf config for receiving S2S2 satellite telemetry (CW1/CW2 Morse +
# any AX.25/G3RUH digital traffic, e.g. ACK/command echoes) via SDR.
#
# RF link parameters (Mission/config.h, JC2/CLAUDE.md):
#   Satellite downlink (what you are receiving here): 435.313 MHz
#   Ground station uplink (not this file's concern):  437.375 MHz
#   Bit rate: 4800 bps, G3RUH scrambled, GFSK (h=0.5, Gaussian BT=0.5 --
#     electrically GMSK-equivalent; the chip's own packet-engine name
#     for this modem is "GFSK", there's no separate GMSK hardware mode).
#
# Direwolf defaults 4800 bps to V.27 8PSK (its "standard values" table --
# see `direwolf -h`), NOT G3RUH -- this project deliberately runs G3RUH
# at 4800 baud (not the usual 9600) for better link margin on a short
# UHF hop, so the G3RUH profile must be forced explicitly or nothing
# will decode. Either set it here (MODEM line below) or pass `-g` on
# the direwolf command line in addition to `-B 4800`.
#
# Usage (SDR feeding audio via rtl_fm piped into direwolf's stdin, tuned
# a few kHz either side of 435.313 MHz to get the FM-demodulated audio
# centered where Direwolf expects it -- adjust SDR_FREQ_HZ below for
# your dongle's actual PPM-corrected center):
#
#   rtl_fm -f 435.313M -s 48000 -g 40 | \
#     direwolf -c tools/direwolf_s2s2_4800.conf -r 48000 -n 1 -B 4800 -g -t 0 -

ADEVICE stdin null
ACHANNELS 1

# Forces the G3RUH/K9NG modem at 4800 bps instead of Direwolf's default
# V.27 8PSK profile for that bitrate.
MODEM 4800 g3ruh

MYCALL GROUND-1

# AGW/KISS network ports for a GUI (e.g. Xastir, YAAC) or the project's
# own tools/console.py to pull decoded frames from, instead of only the
# direwolf stdout log.
AGWPORT 8000
KISSPORT 8001
