# boot_cpu2.cfg -- one-time CPU2 (M0+) boot bring-up for this Nucleo-WL55JC:
#   1. flashes ipcc_m0plus.bin at 0x08020000 (normal, via cpu0's AHB flash bank)
#   2. rewrites FLASH_SRRVR.SBRV option byte so CPU2's boot vector points at
#      0x08020000 instead of whatever stale address (0x08032000, seen on
#      this chip) was left over from some prior image
#   3. sets PWR_CR4.C2BOOT and resets, so CPU2 actually boots into it
#
# Needs real SWD-DAP dual-core access (stlink.cfg's HLA transport cannot
# see CPU2 as a target at all -- that's why plain st-flash/`make flash_sat`
# never worked): run with
#   openocd -f interface/stlink-dap.cfg -c "transport select dapdirect_swd" \
#           -c "set DUAL_CORE 1" -f target/stm32wlx.cfg -f boot_cpu2.cfg
#
# Register addresses/formula verified against this chip's own CMSIS header
# (STM32CubeWL's stm32wl55xx.h FLASH_TypeDef struct) and ST's own HAL
# (stm32wlxx_hal_flash_ex.c:1269 -- CPU2 boot addr = (SBRV<<2)+FLASH_BASE
# when SRRVR.C2OPT selects flash boot, which it already does on this chip).

set FLASH_BASE   0x58004000
set FLASH_KEYR   [expr {$FLASH_BASE + 0x08}]
set FLASH_OPTKEYR [expr {$FLASH_BASE + 0x0C}]
set FLASH_SR     [expr {$FLASH_BASE + 0x10}]
set FLASH_CR     [expr {$FLASH_BASE + 0x14}]
set FLASH_SRRVR  [expr {$FLASH_BASE + 0x84}]
set PWR_CR4      0x5800040C

set FLASH_KEY1    0x45670123
set FLASH_KEY2    0xCDEF89AB
set FLASH_OPTKEY1 0x08192A3B
set FLASH_OPTKEY2 0x4C5D6E7F

# Bit masks
set CR_OPTSTRT    0x00020000
set CR_OBL_LAUNCH 0x08000000
set SR_BSY        0x00010000
set PWR_C2BOOT    0x00008000

# New SRRVR value: current 0xFEFFC800 with SBRV[15:0] replaced by 0x8000
# (0x8000<<2 + 0x08000000 = 0x08020000), every other field (C2OPT,
# NBRSD, SNBRSA, BRSD, SBRSA -- none of which this project uses) left
# exactly as this chip already had them.
set NEW_SRRVR 0xFEFF8000

init
targets stm32wlx.cpu0
halt

echo "--- flashing ipcc_m0plus.bin at 0x08020000 ---"
flash write_image erase ../ipcc_m0plus.bin 0x08020000
flash verify_image ../ipcc_m0plus.bin 0x08020000

echo "--- current FLASH_SRRVR before change ---"
mdw $FLASH_SRRVR 1

echo "--- unlocking FLASH_CR ---"
mww $FLASH_KEYR $FLASH_KEY1
mww $FLASH_KEYR $FLASH_KEY2

echo "--- unlocking option bytes ---"
mww $FLASH_OPTKEYR $FLASH_OPTKEY1
mww $FLASH_OPTKEYR $FLASH_OPTKEY2

echo "--- confirm CR unlocked (expect 0x00000000) ---"
mdw $FLASH_CR 1

echo "--- writing new SRRVR ---"
mww $FLASH_SRRVR $NEW_SRRVR

echo "--- starting option byte programming (OPTSTRT) ---"
mww $FLASH_CR $CR_OPTSTRT

# Poll BSY until clear
set busy 1
while {$busy} {
    set val [mem2array busy_arr 32 $FLASH_SR 1]
    set sr $busy_arr(0)
    if {($sr & $SR_BSY) == 0} {
        set busy 0
    }
}
echo "--- option byte programming done, FLASH_SR clear ---"

echo "--- readback SRRVR (expect 0xfeff8000) ---"
mdw $FLASH_SRRVR 1

echo "--- launching option bytes (OBL_LAUNCH -- this resets the chip) ---"
mww $FLASH_CR $CR_OBL_LAUNCH

# OBL_LAUNCH causes an immediate system reset; give it a moment then
# reconnect implicitly happens via the next openocd invocation (this
# script's connection will drop here, that's expected).
sleep 500
echo "--- done: reconnect and set PWR_CR4.C2BOOT + reset run in a second pass ---"
shutdown
